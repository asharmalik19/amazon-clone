[project]
name = "amazon-clone"
version = "0.1.0"
description = "An Amazon-inspired storefront covering the primary shopping journey."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.36",
    # psycopg 3; the binary wheel keeps libpq out of the Docker build.
    "psycopg[binary]==3.2.3",
    # Password hashing. The `bcrypt` package directly rather than passlib: passlib has
    # had no release since 2019 and its bcrypt backend breaks against bcrypt 4.x, and
    # the only thing this app needs from it is one hash and one verify.
    "bcrypt==4.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Session-capture tooling, not part of the application.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
