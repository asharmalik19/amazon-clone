# Infrastructure as code: the web service and its database are declared here so the
# deploy is reviewable and reproducible, not a sequence of dashboard clicks.
#
# Postgres is declared from Phase 2 even though the schema arrives in Phase 3, because
# Render injects DATABASE_URL from this block -- the app must never fall back to the
# ephemeral SQLite default in production, where a redeploy would wipe it.

databases:
  - name: amazonia-db
    databaseName: amazonia
    user: amazonia
    plan: free
    region: oregon

services:
  - type: web
    name: amazonia
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    # Every commit to `main` reaches the live URL; there is never an un-deployed backlog.
    autoDeployTrigger: commit
    # Lets Render tell a container that is still booting from one that is broken.
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amazonia-db
          property: connectionString
      # Generated by Render and never committed. Rotating it invalidates sessions,
      # which is the intended behaviour.
      - key: SECRET_KEY
        generateValue: true
